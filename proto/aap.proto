syntax = "proto2";
package aap;
message Empty {}

message Status { required int32 status = 1; }
message ChannelOpen { required sint32 priority = 1; required int32 channel_id = 2; }
message Ping { required int64 timestamp = 1; }
message Shutdown { required uint32 reason = 1; }
message AudioConfig {
  required uint32 sample_rate = 1;
  required uint32 bit_depth = 2;
  required uint32 channel_count = 3;
}
message VideoConfig {
  optional uint32 video_resolution = 1;
  optional uint32 video_fps = 2;
  optional uint32 margin_width = 3;
  optional uint32 margin_height = 4;
  optional uint32 dpi = 5;
  optional uint32 codec = 10;
}
message AVChannel {
  optional uint32 stream_type = 1;
  optional uint32 audio_type = 2;
  repeated AudioConfig audio_configs = 3;
  repeated VideoConfig video_configs = 4;
}
message AVInput { optional uint32 stream_type = 1; optional AudioConfig audio_config = 2; }
message TouchScreen { required uint32 width = 1; required uint32 height = 2; }
message InputChannel { repeated uint32 keycodes = 1 [packed = true]; optional TouchScreen touchscreen = 2; }
message Sensor { required uint32 type = 1; }
message SensorChannel { repeated Sensor sensors = 1; }
message NavigationChannel { required int32 minimum_interval_ms = 1; required uint32 type = 2; }
message Channel {
  required int32 channel_id = 1;
  optional SensorChannel sensor = 2;
  optional AVChannel av = 3;
  optional InputChannel input = 4;
  optional AVInput av_input = 5;
  optional Empty media_info = 9;
  optional NavigationChannel navigation = 8;
  optional Empty phone = 10;
}
message Discovery {
  repeated Channel channels = 1;
  optional string head_unit_name = 2;
  optional uint32 driver_position = 6;
  optional string manufacturer = 7;
  optional string model = 8;
  optional string sw_build = 9;
  optional string sw_version = 10;
}
message SetupRequest { required uint32 codec = 1; }
message SetupResponse { required uint32 status = 1; optional uint32 max_unacked = 2; repeated uint32 configs = 3; }
message Start { required int32 session = 1; required uint32 config = 2; }
message Ack { required int32 session_id = 1; optional uint32 ack_count = 2; repeated uint64 receive_timestamps = 3; }
message FocusRequest { optional uint32 type = 1; }
message FocusResponse { required uint32 state = 1; }
message VideoFocusRequest { optional uint32 mode = 2; optional uint32 reason = 3; }
message VideoFocus { required uint32 focus = 1; optional bool unrequested = 2; }
message Binding { repeated uint32 keycodes = 1 [packed = true]; }
message TouchLocation { required uint32 x = 1; required uint32 y = 2; required uint32 pointer_id = 3; }
message TouchEvent { repeated TouchLocation locations = 1; optional uint32 action_index = 2; optional uint32 action = 3; }
message Button { required uint32 keycode = 1; required bool pressed = 2; required uint32 meta = 3; optional bool long_press = 4; }
message Buttons { repeated Button buttons = 1; }
message RelativeInput { required uint32 scan_code = 1; required int32 delta = 2; }
message RelativeInputs { repeated RelativeInput events = 1; }
message InputEvent { required uint64 timestamp = 1; optional TouchEvent touch = 3; optional Buttons button = 4; optional RelativeInputs relative = 6; }
message SensorStart { required uint32 type = 1; required int64 refresh_interval = 2; }
message Night { required bool night = 1; }
message Driving { required uint32 status = 1; }
message SensorEvent { repeated Night night = 10; repeated Driving driving = 13; }
message MicOpen { optional bool open = 1; optional bool anc = 2; optional bool ec = 3; optional int32 max_unacked = 4; }
message MicResponse { optional int32 session = 1; optional int32 value = 2; }
// Control-channel extensions. Keep optional presence for cross-version peers.
message NavigationFocus { optional uint32 type = 1; }
message VoiceSession { optional uint32 session_type = 1; }
message BatteryStatus {
  optional uint32 battery_level = 1;
  optional uint32 time_remaining_s = 2;
  optional bool critical_battery = 3;
}
message CallAvailability { optional bool call_available = 1; }
// MEDIA_INFO phone-to-head-unit notifications: 0x8001 and 0x8003.
message MediaStatus {
  optional uint32 state = 1;
  optional string source_app = 2;
  optional uint32 position_seconds = 3;
  optional bool shuffle = 4;
  optional bool repeat = 5;
  optional bool repeat_one = 6;
}
// Text-only subset. Field 4 album art and fields 5..7 with uncertain meanings
// are intentionally skipped using protobuf unknown-field handling.
message MediaMetadata {
  optional string title = 1;
  optional string artist = 2;
  optional string album = 3;
}
message PhoneCall {
  required uint32 state = 1;
  required uint32 duration_seconds = 2;
  optional string number = 3;
  optional string display_name = 4;
  optional string contact_id = 5;
  // Contact-photo field 6 is intentionally skipped.
}
message PhoneStatus { repeated PhoneCall calls = 1; optional uint32 signal_strength = 2; }
message PhoneInputType { required uint32 action = 1; }
message PhoneInput {
  required PhoneInputType input_type = 1;
  optional string caller_id = 2;
  optional string display_name = 3;
}
message NavigationState { optional uint32 state = 1; }
message NavManeuver {
  optional uint32 type = 1;
  optional int32 exit_number = 2;
  optional int32 turn_angle = 3;
}
message NavText { optional string text = 1; }
message NavDirection { optional uint32 shape = 1; optional bool recommended = 2; }
message NavLane { repeated NavDirection directions = 1; }
message NavRoadInfo { repeated string road_names = 1; }
message NavStep {
  optional NavManeuver maneuver = 1;
  optional NavText instruction = 2;
  repeated NavLane lanes = 3;
  optional NavRoadInfo road_info = 4;
}
message NavChargingStation {
  optional int32 connector_count = 1;
  optional int32 available_count = 2;
  optional int32 max_power_kw = 3;
}
message NavDestination {
  optional string address = 1;
  optional NavChargingStation charging_station = 2;
}
message NavigationNotification { repeated NavStep steps = 1; repeated NavDestination destinations = 2; }
message NavDistance {
  optional int32 value = 1;
  optional string display_text = 2;
  optional uint32 unit = 3;
}
message NavStepDistance { optional NavDistance distance = 1; optional int64 time_to_step_seconds = 2; }
message NavDestinationDistance {
  optional NavDistance distance = 1;
  optional string estimated_time_of_arrival = 2;
  optional int64 time_to_arrival_seconds = 3;
}
message NavigationPosition {
  optional NavStepDistance step_distance = 1;
  repeated NavDestinationDistance destinations = 2;
  optional NavText current_road = 3;
}
message NavigationTurn {
  optional string road_name = 1;
  optional uint32 maneuver_type = 2;
  optional uint32 turn_direction = 3;
  // Legacy icon field 4 is intentionally skipped.
  optional int32 distance_meters = 5;
  optional int32 distance_unit = 6;
}
// Bluetooth RFCOMM bootstrap; separate framing and namespace from AAP.
message WifiStart { required string address = 1; required uint32 port = 2; }
message WifiInfoRequest {}
message WifiCredentials {
  required string ssid = 1;
  required string key = 2;
  required string bssid = 3;
  required uint32 security = 4;
  required uint32 access_point_type = 5;
}
message WifiConnectStatus { optional int32 state = 1; optional string text = 2; }
message WifiStartResponse {
  optional string address = 1;
  optional int32 port = 2;
  optional int32 status = 3;
}
message WifiPing { optional int64 timestamp = 1; }
message WifiRejection { optional int32 reason = 1; }
